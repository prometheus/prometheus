---
###
# This action is synced from https://github.com/prometheus/prometheus
###
name: Approve pending workflows

on:
  issue_comment:
    types: [created]

permissions: read-all

jobs:
  approve:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/workflow-approve' &&
      (github.repository_owner == 'prometheus' || github.repository_owner == 'prometheus-community')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - uses: prometheus/promci/approve_workflows@872d318d090d73df349cb6ed90aadd072ca478f7 # v0.10.0
        with:
          github_token: ${{ github.token }}
