# The old React app has been separated from the npm workspaces setup to avoid
# issues with conflicting dependencies. This is a temporary solution until the
# new Mantine-based UI is fully integrated and the old app can be removed.
packages: []
peerDependencyRules:
  allowedVersions:
    # Reactstrap 8 uses react-popper whose peer metadata predates React 18; interaction tests cover compatibility.
    'react-popper@1.3.11>react': ^18.0.0
    # These versions work with ESLint 10 through @eslint/compat; lint integration tests cover the enabled rules.
    'eslint-plugin-react@7.37.5>eslint': ^10.0.0
    'eslint-plugin-jsx-a11y@6.10.2>eslint': ^10.0.0
    'eslint-plugin-import@2.32.0>eslint': ^10.0.0
strictDepBuilds: true
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
blockExoticSubdeps: true
