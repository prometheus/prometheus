packages: []
overrides:
  # Enzyme loads Cheerio before Jest setup; newer versions require TextDecoder.
  enzyme>cheerio: 1.2.0
peerDependencyRules:
  allowedVersions:
    # Reactstrap 8 uses react-popper whose peer metadata predates React 18; interaction tests cover compatibility.
    'react-popper@1.3.11>react': ^18.0.0
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
