  # --- State metrics: state in the value -> state in an attribute -----------
  # The value moves to an attribute and becomes 1. Approximate: only the
  # current state is reported, so the 0-valued series for the other states
  # (which semconv producers emit) can't be created.
  - id: k8s-pod-phase
    name: k8s.pod.phase (1-5) becomes k8s.pod.status.phase{k8s.pod.status.phase=<phase>} = 1
    description: >
      Target-safe: v1.44 has no k8s.pod.phase metric.
    metric_transform:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: k8s.pod.phase}
      rename: [{from: {datapoint_field: DATAPOINT_FIELD_VALUE}, to: k8s.pod.status.phase}]
      add:
        - {target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}, value: k8s.pod.status.phase, upsert: true}
        - {target: {datapoint_field: DATAPOINT_FIELD_VALUE}, value: 1, upsert: true}
      map: [{target: {datapoint_attribute: [k8s.pod.status.phase]}, values: {1: Pending, 2: Running, 3: Succeeded, 4: Failed, 5: Unknown}}]

  - id: k8s-namespace-phase
    name: value-encoded k8s.namespace.phase (1 active, 0 terminating) becomes k8s.namespace.phase{k8s.namespace.phase=<phase>} = 1
    description: >
      Same metric name in both shapes. Target-safe: requiring the phase
      attribute to be absent keeps semconv records out.
    metric_transform:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: k8s.namespace.phase}
        - target: {datapoint_attribute: [k8s.namespace.phase]}
          predicate: {exists: {}}
          negate: true
      rename: [{from: {datapoint_field: DATAPOINT_FIELD_VALUE}, to: k8s.namespace.phase}]
      add: [{target: {datapoint_field: DATAPOINT_FIELD_VALUE}, value: 1, upsert: true}]
      map: [{target: {datapoint_attribute: [k8s.namespace.phase]}, values: {1: active, 0: terminating}}]

  - id: k8s-pod-status-reason-drop-unknown
    name: k8s.pod.status_reason series with value 6 (no or other reason) are dropped
    description: >
      Semconv has no value for it: a Pod without one of the known reasons has
      all k8s.pod.status.reason series at 0. Data point level: the matcher
      reads the value.
    metric_filter:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: k8s.pod.status_reason}
        - target: {datapoint_field: DATAPOINT_FIELD_VALUE}
          predicate: {equals: 6}
      action: ACTION_DROP

  - id: k8s-pod-status-reason
    name: k8s.pod.status_reason (1-5) becomes k8s.pod.status.reason{k8s.pod.status.reason=<reason>} = 1
    metric_transform:
