        - {from: {resource_attribute: [k8s.volume.name]}, to_target: {datapoint_attribute: [k8s.volume.name]}}
        - {from: {resource_attribute: [k8s.volume.type]}, to_target: {datapoint_attribute: [k8s.volume.type]}}
      add: [{target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}, value: k8s.pod.volume.inode.used, upsert: true}]

  # --- Paging faults: only the major partition is exact ---------------------
  - id: k8s-pod-major-page-faults
    name: k8s.pod.memory.major_page_faults becomes k8s.pod.paging.faults{type=major}
    metric_transform:
      matches:
