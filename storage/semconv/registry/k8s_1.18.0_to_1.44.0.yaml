  # --- ResourceQuota metrics: one policy per (metric, resource key) ---------
  # `resource` is pinned by the matcher, so removing it never merges series.
  # The bare `memory` / `ephemeral-storage` keys are aliases of the
  # requests.* keys and share their policies.
  - id: k8s-rq-hard-cpu-limit
    name: k8s.resource_quota.hard_limit{resource=limits.cpu} becomes k8s.resourcequota.cpu.limit.hard
    description: >
      Unit change millicores -> cores is not expressible; query rewriters
      multiply results by 0.001; data in flight needs an SDK View or a
      Collector processor.
    metric_transform:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: k8s.resource_quota.hard_limit}
        - target: {datapoint_attribute: [resource]}
          predicate: {equals: limits.cpu}
      remove: [{target: {datapoint_attribute: [resource]}}]
      add: [{target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}, value: k8s.resourcequota.cpu.limit.hard, upsert: true}]

  - id: k8s-rq-used-cpu-limit
