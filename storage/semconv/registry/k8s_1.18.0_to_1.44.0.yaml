  # moving them off the resource doesn't affect other metrics.
  - id: k8s-pod-volume-available
    name: k8s.volume.available becomes k8s.pod.volume.available
    metric_transform:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: k8s.volume.available}
      rename:
        - {from: {resource_attribute: [k8s.volume.name]}, to_target: {datapoint_attribute: [k8s.volume.name]}}
        - {from: {resource_attribute: [k8s.volume.type]}, to_target: {datapoint_attribute: [k8s.volume.type]}}
