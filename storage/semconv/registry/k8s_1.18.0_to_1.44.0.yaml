      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: openshift.clusterquota.limit}
        - target: {datapoint_attribute: [resource]}
          predicate: {equals: limits.cpu}
