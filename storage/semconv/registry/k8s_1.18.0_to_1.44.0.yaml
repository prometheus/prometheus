      remove: [{target: {datapoint_attribute: [resource]}}]
      add: [{target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}, value: k8s.resourcequota.ephemeral_storage.request.used, upsert: true}]

  - id: k8s-rq-hard-storage-request
    name: k8s.resource_quota.hard_limit{resource=requests.storage} becomes k8s.resourcequota.storage.request.hard
    description: Namespace-wide storage quota; semconv omits k8s.storageclass.name for it.
