        - {target: {datapoint_field: DATAPOINT_FIELD_VALUE}, value: 1, upsert: true}
      map: [{target: {datapoint_attribute: [k8s.pod.status.reason]}, values: {1: Evicted, 2: NodeAffinity, 3: NodeLost, 4: Shutdown, 5: UnexpectedAdmissionError}}]

  - id: k8s-node-condition-ready
