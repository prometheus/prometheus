  # --- Paging faults: all fault types sum to the old total ------------------
  # semconv: minor = PageFaults - MajorPageFaults, so summing over
  # system.paging.fault.type gives the old *.memory.page_faults (PageFaults).
  # The sum is query time only: the renamed metric keeps one series per fault
  # type, and removing the attribute would merge series.
  - id: rev-k8s-pod-page-faults
    name: k8s.pod.paging.faults becomes k8s.pod.memory.page_faults (summed at query time)
    metric_transform:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: k8s.pod.paging.faults}
      add: [{target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}, value: k8s.pod.memory.page_faults, upsert: true}]

