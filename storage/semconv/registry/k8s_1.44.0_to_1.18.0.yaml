      rename: [{from: {datapoint_attribute: [k8s.pod.status.reason]}, to_target: {datapoint_field: DATAPOINT_FIELD_VALUE}, upsert: true}]
      add: [{target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}, value: k8s.pod.status_reason, upsert: true}]
      map: [{target: {datapoint_field: DATAPOINT_FIELD_VALUE}, values: {Evicted: 1, NodeAffinity: 2, NodeLost: 3, Shutdown: 4, UnexpectedAdmissionError: 5}}]

