# K8s migration: semantic conventions v1.44.0 -> pre-stability (Collector
# k8scluster / kubeletstats / k8sattributes) conventions.
#
# Lets dashboards written against the Collector's old names also see data
# from producers that emit the stable K8s conventions. Written independently
# of collector-1.18.0_to_1.44.0.yaml (not a mechanical inversion).
#
# Not bridgeable / not expressible in this direction (see the appendix in ../../schema-transformations.md):
#   - *.limit.current / *.request.current, k8s.pod.cpu.*: no old equivalent
#     (extra in source, ignored)
#   - k8s.{pod,node}.memory.major_page_faults and container.memory.major_page_faults:
#     the major partition of *.paging.faults already feeds the old total
#     *.memory.page_faults; a record can't be copied to two metrics. The old
#     total itself is a query-time sum over system.paging.fault.type
#   - ResourceQuota / ClusterResourceQuota hugepages
#     (requests.hugepages-<size>) and per-storage-class keys
#     (<class>.storageclass.storage.k8s.io/...): the old key is built from an
#     attribute value, which needs value templates
#   - ResourceQuota CPU unit change cores -> millicores (query time only; the
#     metrics are renamed)
#   - k8s.volume.{name,type}: data point -> resource attributes is impossible,
#     one resource carries many volumes
#   - instrument changes updowncounter -> gauge (Prometheus exports both as
#     gauges)
#
# Approximate: k8s.namespace.phase can't produce 0 for terminating namespaces
# if the 0-valued series is missing, or the old -1 (unknown);
# k8s.pod.status_reason can't produce the old 6 (no or other reason).
file_format: transform/2.0
source:
  schema_url: https://opentelemetry.io/schemas/1.44.0
target:
  schema_url: https://opentelemetry.io/schemas/1.18.0
# gaps: not checked, no registry for target (1.18.0)
policies:
  # --- Network metrics: attribute renames back, same metric name ------------
  - id: rev-k8s-pod-network-io-attrs
    name: k8s.pod.network.io attributes renamed back to interface/direction
    description: >
      Target-safe: old records carry `interface` / `direction` and never the
      network.* keys.
    metric_transform:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: k8s.pod.network.io}
      rename:
        - {from: {datapoint_attribute: [network.interface.name]}, to: interface}
        - {from: {datapoint_attribute: [network.io.direction]}, to: direction}

  - id: rev-k8s-pod-network-errors-attrs
    name: k8s.pod.network.errors attributes renamed back to interface/direction
    metric_transform:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: k8s.pod.network.errors}
      rename:
        - {from: {datapoint_attribute: [network.interface.name]}, to: interface}
        - {from: {datapoint_attribute: [network.io.direction]}, to: direction}

  - id: rev-k8s-node-network-io-attrs
    name: k8s.node.network.io attributes renamed back to interface/direction
    metric_transform:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: k8s.node.network.io}
      rename:
        - {from: {datapoint_attribute: [network.interface.name]}, to: interface}
        - {from: {datapoint_attribute: [network.io.direction]}, to: direction}

  - id: rev-k8s-node-network-errors-attrs
    name: k8s.node.network.errors attributes renamed back to interface/direction
    metric_transform:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: k8s.node.network.errors}
      rename:
        - {from: {datapoint_attribute: [network.interface.name]}, to: interface}
        - {from: {datapoint_attribute: [network.io.direction]}, to: direction}

