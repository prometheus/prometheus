      add: [{target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}, value: container.memory.page_faults, upsert: true}]

  # --- Namespace phase: same name, different shape --------------------------
  # Old: one series per namespace, 1 = active, 0 = terminating, no phase
  # attribute. Stable: k8s.namespace.phase{k8s.namespace.phase=<phase>}.
  # Both policies require the phase attribute, which old data never has, so
  # they leave old-shaped data unchanged.
  - id: rev-k8s-namespace-phase-active
    name: k8s.namespace.phase{phase=active} becomes the old value-encoded k8s.namespace.phase
    description: >
      The active series is 1 for an active namespace and 0 otherwise, which is
      the old encoding. Removing the phase doesn't merge series: it's pinned
      by the matcher. Caveats: semconv doesn't require producers to emit the
      0-valued series, so terminating namespaces may be missing instead of 0;
      the old -1 (unknown phase) can't be produced.
    metric_transform:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: k8s.namespace.phase}
        - target: {datapoint_attribute: [k8s.namespace.phase]}
          predicate: {equals: active}
      remove: [{target: {datapoint_attribute: [k8s.namespace.phase]}}]

  - id: rev-k8s-namespace-phase-drop-other
    name: k8s.namespace.phase series for other phases are dropped
    metric_filter:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: k8s.namespace.phase}
        - target: {datapoint_attribute: [k8s.namespace.phase]}
          predicate: {exists: {}}
        - target: {datapoint_attribute: [k8s.namespace.phase]}
          predicate: {equals: active}
          negate: true
      action: ACTION_DROP

  # --- State metrics: state in an attribute -> state in the value -----------
  # Semconv reports every state: 1 on the current one, 0 on the others. The
  # filter policies drop the 0-valued series (filters run before transforms,
  # and the value matcher makes them data point level). On the remaining
  # series the state attribute moves into the value. Old data has neither
  # metric name, so it's left unchanged.
  - id: rev-k8s-pod-phase-drop-zero
    name: k8s.pod.status.phase series with value 0 are dropped
    metric_filter:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
