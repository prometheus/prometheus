# OpenTelemetry semantic conventions -> Prometheus classic metric/label conventions.
#
# Reverse of prometheus_to_otel.yaml, allowing existing Prometheus queries and
# recording rules written against classic names (cAdvisor, kube-state-metrics,
# go-grpc-prometheus, classic HTTP) to transparently read OTel UTF-8 series.
file_format: transform/2.0
source:
  schema_url: https://opentelemetry.io/schemas/otel-canonical
target:
  schema_url: https://prometheus.io/schemas/classic
gaps: {}
policies:
  - id: otel-http-server-request-duration-to-prom
    name: http.server.request.duration becomes http_server_request_duration_seconds
    metric_transform:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: http.server.request.duration}
      remove:
        - target: {datapoint_attribute: [error.type]}
      rename:
        - {from: {datapoint_attribute: [http.request.method]}, to: method}
        - {from: {datapoint_attribute: [http.response.status_code]}, to: status_code}
        - {from: {datapoint_attribute: [url.scheme]}, to: scheme}
        - {from: {datapoint_attribute: [network.protocol.version]}, to: protocol_version}
      add:
        - {target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}, value: http_server_request_duration_seconds, upsert: true}

  - id: otel-k8s-pod-network-receive-to-prom
    name: k8s.pod.network.io{network.io.direction="receive"} becomes container_network_receive_bytes_total
    metric_transform:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: k8s.pod.network.io}
        - target: {datapoint_attribute: [network.io.direction]}
          predicate: {equals: receive}
      remove:
        - target: {datapoint_attribute: [network.io.direction]}
      rename:
        - {from: {datapoint_attribute: [k8s.pod.name]}, to: pod}
        - {from: {datapoint_attribute: [k8s.namespace.name]}, to: namespace}
        - {from: {datapoint_attribute: [network.interface.name]}, to: interface}
      add:
        - {target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}, value: container_network_receive_bytes_total, upsert: true}

  - id: otel-k8s-pod-network-transmit-to-prom
    name: k8s.pod.network.io{network.io.direction="transmit"} becomes container_network_transmit_bytes_total
    metric_transform:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: k8s.pod.network.io}
        - target: {datapoint_attribute: [network.io.direction]}
          predicate: {equals: transmit}
      remove:
        - target: {datapoint_attribute: [network.io.direction]}
      rename:
        - {from: {datapoint_attribute: [k8s.pod.name]}, to: pod}
        - {from: {datapoint_attribute: [k8s.namespace.name]}, to: namespace}
        - {from: {datapoint_attribute: [network.interface.name]}, to: interface}
      add:
        - {target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}, value: container_network_transmit_bytes_total, upsert: true}

  - id: otel-k8s-pod-status-phase-to-prom
    name: k8s.pod.status.phase becomes kube_pod_status_phase
    metric_transform:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: k8s.pod.status.phase}
      rename:
        - {from: {datapoint_attribute: [k8s.pod.name]}, to: pod}
        - {from: {datapoint_attribute: [k8s.namespace.name]}, to: namespace}
        - {from: {datapoint_attribute: [k8s.pod.status.phase]}, to: phase}
      add:
        - {target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}, value: kube_pod_status_phase, upsert: true}

  - id: otel-rpc-client-call-duration-to-prom
    name: rpc.client.call.duration{rpc.system.name="grpc"} becomes grpc_client_handling_seconds
    metric_transform:
      matches:
        - target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}
          predicate: {equals: rpc.client.call.duration}
        - target: {datapoint_attribute: [rpc.system.name]}
          predicate: {equals: grpc}
      remove:
        - target: {datapoint_attribute: [rpc.system.name]}
      rename:
        - {from: {datapoint_attribute: [rpc.response.status_code]}, to: grpc_code}
      split:
        - {from: {datapoint_attribute: [rpc.method]}, separator: "/", to: [grpc_service, grpc_method]}
      add:
        - {target: {descriptor_field: METRIC_DESCRIPTOR_FIELD_NAME}, value: grpc_client_handling_seconds, upsert: true}
      discard:
        - target: {datapoint_attribute: [rpc.method]}
